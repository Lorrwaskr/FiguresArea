apiVersion: apps/v1
kind: Deployment
metadata:
  name: mind-web-app-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mind-web-app
  template:
    metadata:
      labels:
        app: mind-web-app
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - mind-web-app
              topologyKey: "kubernetes.io/hostname"
      containers:
      - name: mind-web-app
        image: registry/mind-web-app:v2.1
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "400m"
            memory: "384Mi"
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 45
          periodSeconds: 20
        ports:
        - containerPort: 8080
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 1
